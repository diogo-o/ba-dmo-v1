name: Template access validation

on:
  push:
    branches:
      - template-access-rework
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./BA-DMO.sln

      - name: Build
        run: dotnet build ./BA-DMO.sln -c Release --no-restore

      - name: Test
        run: dotnet test ./BA-DMO.sln -c Release --no-build
